<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#070d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="description" content="A private, offline habit tracker with streaks, statistics and a calendar.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)">
<link rel="apple-touch-startup-image" href="splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<title>Habit Tracker</title>
<style>
  :root{
    --bg:#070d18; --panel:#0e1727; --panel2:#0b1422; --line:#1b2b44;
    --text:#e8f2ff; --muted:#7f8fa8; --dim:#55647c;
    --accent:#22d3ee; --good:#4ade80; --warn:#facc15; --bad:#f87171;
    --r:16px; --pad:16px; --nav:rgba(14,23,39,.94);
  }
  [data-theme="oled"]{
    --bg:#000000; --panel:#07090e; --panel2:#040508; --line:#1a2233;
    --text:#f2f7ff; --muted:#8794a8; --dim:#5b6879; --nav:rgba(5,7,12,.96);
  }
  [data-theme="day"]{
    --bg:#f4f7fb; --panel:#ffffff; --panel2:#eef3f9; --line:#dbe4ef;
    --text:#101c2c; --muted:#5b6b80; --dim:#8695a8;
    --accent:#0891b2; --nav:rgba(255,255,255,.95);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    font-size:15px; line-height:1.35; -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 var(--pad);}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
  h1,h2,h3{margin:0;font-weight:700;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .tiny{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;}

  header{padding:18px 0 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  .hello h1{font-size:22px;letter-spacing:-.02em;}
  .hello .small{margin-top:3px;}
  .ring{position:relative;width:74px;height:74px;flex:0 0 auto;}
  .ring svg{display:block;transform:rotate(-90deg);}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;}
  .section{margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between;}
  .section .tiny{letter-spacing:.14em;}

  .habit{
    display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:14px;margin-bottom:10px;transition:transform .12s ease,border-color .12s;
  }
  .habit:active{transform:scale(.988);}
  .habit.done{border-color:rgba(34,211,238,.4);}
  .tick{
    width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
    border:2px solid var(--line);color:var(--muted);font-weight:700;transition:all .15s ease;
  }
  .tick.on{border-color:transparent;color:#04121c;}
  .tick svg{width:20px;height:20px;}
  .habit .body{flex:1;min-width:0;}
  .habit .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .habit .meta{display:flex;align-items:center;gap:8px;margin-top:3px;color:var(--muted);font-size:11.5px;}
  .chip{padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:10px;
        letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .streak{display:flex;align-items:center;gap:4px;color:var(--warn);font-size:12px;font-weight:700;}
  .dots{display:flex;gap:4px;margin-top:7px;}
  .dots i{flex:1 1 0;min-width:0;height:4px;border-radius:2px;background:var(--line);}
  .dots i.on{background:var(--accent);}
  .dots i.today{box-shadow:0 0 0 1.5px var(--accent);}

  .primary{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--accent);color:#04121c;font-weight:700;padding:14px;border-radius:14px;margin-top:6px;
  }
  .primary:active{filter:brightness(.94);}
  .ghost{border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--muted);font-weight:600;}
  .ghost:active{background:var(--panel2);}

  .empty{text-align:center;padding:34px 12px;color:var(--muted);}
  .empty .big{font-size:34px;margin-bottom:10px;}
  .empty h3{font-size:16px;color:var(--text);margin-bottom:6px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;}
  .kpi b{display:block;font-size:26px;letter-spacing:-.02em;}
  .kpi span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
  .ranges{display:flex;gap:8px;margin:14px 0 4px;}
  .ranges button{flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);color:var(--muted);
                 font-size:12px;font-weight:700;}
  .ranges button.on{background:var(--accent);border-color:var(--accent);color:#04121c;}
  .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:118px;}
  .barwrap{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-height:0;gap:5px;}
  .bar{border-radius:6px 6px 3px 3px;min-height:4px;background:var(--accent);opacity:.9;}
  .barwrap small{text-align:center;color:var(--dim);font-size:9px;}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;}
  .row+.row{border-top:1px solid var(--line);}
  .row .lbl{flex:0 0 38%;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track{flex:1;height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;}
  .fill{height:100%;border-radius:5px;}
  .row .val{flex:0 0 42px;text-align:right;font-size:12px;color:var(--muted);}

  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .calhead .nav{display:flex;gap:6px;}
  .calhead .nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
                       display:grid;place-items:center;color:var(--muted);}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .calgrid .wd{text-align:center;font-size:9px;color:var(--dim);padding-bottom:2px;text-transform:uppercase;}
  .day{aspect-ratio:1;border-radius:10px;background:var(--panel2);display:grid;place-items:center;
       font-size:11px;color:var(--muted);border:1px solid transparent;}
  .day.today{border-color:var(--accent);}
  .day.future{opacity:.35;}
  .day.pad{background:transparent;}
  .heat{display:grid;grid-template-rows:repeat(7,9px);grid-auto-flow:column;
        grid-auto-columns:9px;gap:3px;justify-content:space-between;}
  .heat i{width:9px;height:9px;border-radius:2.5px;background:var(--panel2);display:block;}
  .legend{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--dim);font-size:10px;}
  .legend i{width:14px;height:10px;border-radius:3px;display:inline-block;}

  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--nav);
    border-top:1px solid var(--line);backdrop-filter:blur(14px);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  nav .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;}
  nav button{padding:8px 4px;border-radius:12px;color:var(--dim);display:flex;flex-direction:column;
             align-items:center;gap:3px;font-size:9.5px;font-weight:700;letter-spacing:.04em;}
  nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
                 stroke-linecap:round;stroke-linejoin:round;}
  nav button.on{color:var(--accent);background:rgba(34,211,238,.12);}

  .backdrop{position:fixed;inset:0;background:rgba(2,6,12,.72);opacity:0;pointer-events:none;
            transition:opacity .2s ease;z-index:30;backdrop-filter:blur(2px);}
  .backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--panel);
    border-radius:22px 22px 0 0;border-top:1px solid var(--line);
    transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.9,.3,1);
    max-height:92vh;max-height:88dvh;overflow-y:auto;padding:10px var(--pad) calc(34px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .sheet.show{transform:translateY(0);}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px;}
  .sheet h2{font-size:17px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
               color:var(--dim);font-weight:700;margin-bottom:7px;}
  input[type=text],input[type=number],textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:12px;color:var(--text);font-size:15px;outline:none;font-family:inherit;
  }
  input:focus,textarea:focus{border-color:var(--accent);}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;}
  .sw{width:30px;height:30px;border-radius:10px;border:2px solid transparent;}
  .sw.on{border-color:#fff;}
  .sw:focus,.sw:focus-visible,.days .d:focus,.seg button:focus{outline:none;}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .days .d{min-width:0;text-align:center;padding:10px 0;border-radius:10px;border:1px solid var(--line);
           color:var(--muted);font-size:12px;font-weight:700;}
  .days .d.on{background:var(--accent);border-color:var(--accent);color:#04121c;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);color:var(--muted);
              font-size:13px;font-weight:700;}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#04121c;}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .sheet-actions button{flex:1;padding:14px;border-radius:13px;font-weight:700;}
  .danger{color:var(--bad);border:1px solid rgba(248,113,113,.4);}

  .train-stage{position:relative;border-radius:18px;overflow:hidden;background:#05080f;border:1px solid var(--line);
               aspect-ratio:3/4;max-height:62vh;margin-top:12px;}
  .train-stage video,.train-stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .train-stage canvas{pointer-events:none;}
  .train-hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px}
  .train-pill{background:rgba(4,10,18,.72);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
              font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
  .train-msg{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:12px;
             color:#cfe6f5;background:rgba(4,10,18,.66);border-radius:10px;padding:8px}
  .train-empty{display:grid;place-items:center;text-align:center;padding:40px 16px;color:var(--muted)}
  .chips{display:flex;gap:8px;margin-top:12px}
  .chips button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#04121c}

  #toast{
    position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);z-index:40;
    background:#132033;border:1px solid var(--line);border-radius:12px;
    padding:11px 16px;font-size:13px;opacity:0;transition:all .22s ease;pointer-events:none;
    box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:86vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="hello">
      <h1 id="greeting">Good day</h1>
      <div class="small muted" id="dateLine"></div>
    </div>
    <div class="ring">
      <svg width="74" height="74" viewBox="0 0 74 74">
        <circle cx="37" cy="37" r="31" fill="none" stroke="#1b2b44" stroke-width="6"></circle>
        <circle id="ringArc" cx="37" cy="37" r="31" fill="none" stroke="#22d3ee" stroke-width="6"
                stroke-linecap="round" stroke-dasharray="194.8" stroke-dashoffset="194.8"></circle>
      </svg>
      <div class="pct" id="ringPct">0%</div>
    </div>
  </header>

  <main id="page-today"></main>
  <main id="page-stats" hidden></main>
  <main id="page-calendar" hidden></main>
  <main id="page-train" hidden></main>
  <main id="page-settings" hidden></main>
</div>

<nav>
  <div class="inner">
    <button data-page="today" class="on">
      <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>Today</button>
    <button data-page="stats">
      <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Stats</button>
    <button data-page="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>Calendar</button>
    <button data-page="train">
      <svg viewBox="0 0 24 24"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.4"/></svg>Train</button>
    <button data-page="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>More</button>
  </div>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
/* =============================================================== constants */
const STORE_KEY = "nexus.habits.v2";
const OLD_KEYS = ["nexus.habits.v1"];
const PALETTE = ["#22d3ee","#38bdf8","#a78bfa","#f472b6","#facc15","#4ade80","#fb923c","#f87171"];
const CATEGORIES = ["Health","Study","Sport","Work","Home","Mind"];
const DAYS = ["M","T","W","T","F","S","S"];

/* ================================================================== helpers */
const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const n = document.createElement(tag); if(cls) n.className = cls; if(html!==undefined) n.innerHTML = html; return n; };
const iso = d => { const p = n => String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); };
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const c = new Date(d); c.setDate(c.getDate()+n); return c; };
const todayStr = () => iso(new Date());
const mondayIndex = d => (d.getDay() + 6) % 7;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pct = v => Math.round(v*100);
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg, actionLabel, action){
  const t = $("#toast");
  t.innerHTML = "";
  const text = document.createElement("span");
  text.textContent = msg;
  t.appendChild(text);

  if(actionLabel && action){
    const btn = document.createElement("button");
    btn.textContent = actionLabel;
    btn.style.cssText = "margin-left:14px;color:var(--accent);font-weight:700;font-size:13px";
    btn.addEventListener("click", () => { t.classList.remove("show"); action(); });
    t.appendChild(btn);
  }

  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), action ? 4200 : 2200);
}

/* ==================================================================== state */
let state = loadState();
let statsRange = 30;
let calMonth = new Date();

function defaultState(){ return { version: 2, habits: [], settings: { accent:"#22d3ee", name:"", theme:"midnight", lastBackup:"" } }; }

function normalise(data){
  data.settings = Object.assign({ accent:"#22d3ee", name:"", theme:"midnight", lastBackup:"" }, data.settings||{});
  data.habits.forEach(h => {
    h.schedule = Array.isArray(h.schedule) && h.schedule.length ? h.schedule : [0,1,2,3,4,5,6];
    h.goal = h.goal || { type:"check", target:1, unit:"" };
    h.log = h.log || {};
    h.category = h.category || "Health";
    h.reminder = h.reminder || "";
  });
  return data;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && Array.isArray(data.habits)) return normalise(data);
    }
    for(const key of OLD_KEYS){
      const old = localStorage.getItem(key);
      if(old) return migrate(JSON.parse(old));
    }
  }catch(e){}
  return defaultState();
}

function migrate(old){
  const data = defaultState();
  (old.habits||[]).forEach(h => {
    const log = {};
    (h.done||[]).forEach(d => { log[d] = 1; });
    data.habits.push({
      id: h.id || "h" + Math.random().toString(36).slice(2,10),
      name: h.name || "Habit",
      color: h.color || "#22d3ee",
      category: "Health",
      schedule: [0,1,2,3,4,5,6],
      goal: { type:"check", target:1, unit:"" },
      notes: "",
      created: h.created || todayStr(),
      log
    });
  });
  saveState(data);
  return data;
}

function saveState(data){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data || state)); }catch(e){}
}

/* ================================================================ behaviour */
function valueOn(h, day){ return h.log[day] || 0; }
function isDone(h, day){ const d = day || todayStr(); return valueOn(h, d) >= ((h.goal && h.goal.target) || 1); }
function isScheduled(h, day){ return h.schedule.includes(mondayIndex(parse(day))); }

function toggleHabit(h, day){
  day = day || todayStr();
  const target = (h.goal && h.goal.target) || 1;
  if(isDone(h, day)) delete h.log[day];
  else h.log[day] = target;
  saveState();
}

function streak(h){
  // Only days the habit is scheduled for count; today being unfinished does not break it.
  let n = 0;
  const created = parse(h.created);
  let cursor = new Date();
  let guard = 0;

  while(guard++ < 2000){
    const key = iso(cursor);
    if(cursor < created) break;
    if(isScheduled(h, key)){
      if(isDone(h, key)){
        n++;
      }else if(key === todayStr()){
        // still time to finish today
      }else{
        break;
      }
    }
    cursor = addDays(cursor, -1);
  }
  return n;
}

function bestStreak(h){
  const days = Object.keys(h.log).filter(d => isDone(h, d)).sort();
  if(!days.length) return 0;
  let best = 1, run = 1;
  for(let i=1;i<days.length;i++){
    let previous = addDays(parse(days[i]), -1);
    while(previous >= parse(h.created) && !isScheduled(h, iso(previous))){
      previous = addDays(previous, -1);
    }
    const joined = iso(previous) === days[i-1];
    run = joined ? run + 1 : 1;
    if(run > best) best = run;
  }
  return best;
}

function rate(h, windowDays){
  const end = new Date();
  let start = addDays(end, -(windowDays-1));
  const created = parse(h.created);
  if(created > start) start = created;
  let total = 0, hits = 0;
  for(let d = new Date(start); d <= end; d = addDays(d,1)){
    const key = iso(d);
    if(!isScheduled(h, key)) continue;
    total++;
    if(isDone(h, key)) hits++;
  }
  return total ? hits/total : 0;
}

function scheduledToday(){ return state.habits.filter(h => isScheduled(h, todayStr())); }

function dayScore(day){
  const list = state.habits.filter(h => isScheduled(h, day) && h.created <= day);
  if(!list.length) return null;
  return list.filter(h => isDone(h, day)).length / list.length;
}

/* ============================================================== reminders */
function stepsAvailable(){
  return typeof window.AndroidSteps !== "undefined" ? window.AndroidSteps : null;
}

let stepsCache = { value: null, at: 0 };

function refreshSteps(){
  const bridge = stepsAvailable();
  if(!bridge) return null;
  try{
    if(bridge.permissionNeeded && bridge.permissionNeeded()) return null;
    const value = bridge.todaySteps();
    if(value >= 0) stepsCache = { value, at: Date.now() };
  }catch(e){}
  return stepsCache.value;
}

function usesSteps(){ return state.habits.some(h => h.goal && h.goal.type === "steps"); }

function stepsToday(){
  if(stepsCache.value === null || Date.now() - stepsCache.at > 45000) refreshSteps();
  return stepsCache.value;
}

function remindersAvailable(){
  return typeof window.AndroidReminders !== "undefined" && window.AndroidReminders;
}

function applyPendingMarks(){
  const bridge = remindersAvailable();
  if(!bridge || typeof bridge.takePending !== "function") return 0;

  let ids = [];
  try{ ids = JSON.parse(bridge.takePending() || "[]"); }catch(e){ return 0; }
  if(!Array.isArray(ids) || !ids.length) return 0;

  let marked = 0;
  ids.forEach(id => {
    const h = state.habits.find(x => x.id === id);
    if(h && !isDone(h)){
      h.log[todayStr()] = (h.goal && h.goal.target) || 1;
      marked++;
    }
  });

  if(marked){
    saveState();
    renderAll();
    toast(marked + (marked === 1 ? " habit" : " habits") + " marked done from the reminder");
  }
  return marked;
}

function syncReminders(){
  const bridge = remindersAvailable();
  if(!bridge) return false;
  try{
    bridge.cancelAll();
    state.habits.forEach(h => {
      if(!h.reminder) return;
      const [hh, mm] = h.reminder.split(":").map(Number);
      if(isNaN(hh) || isNaN(mm)) return;
      bridge.schedule(h.id, hh, mm, h.name, "Time for " + h.name);
    });
    return true;
  }catch(e){ return false; }
}

/* =============================================================== rendering */
function applyStepGoal(){
  const steps = stepsCache.value;
  if(steps === null) return;
  let changed = false;
  state.habits.forEach(h => {
    if(h.goal.type !== "steps") return;
    if(steps >= h.goal.target && !isDone(h)){
      h.log[todayStr()] = h.goal.target;
      changed = true;
    }
  });
  if(changed) saveState();
}

function renderAll(){
  if(usesSteps()) refreshSteps();
  applyStepGoal();
  document.documentElement.style.setProperty("--accent", state.settings.accent || "#22d3ee");
  document.documentElement.setAttribute("data-theme", state.settings.theme || "midnight");
  renderHeader();
  renderToday();
  if(!$("#page-stats").hidden) renderStats();
  if(!$("#page-calendar").hidden) renderCalendar();
  if(!$("#page-train").hidden) renderTrain();
  if(!$("#page-settings").hidden) renderSettings();
}

    {weekday:"long", day:"numeric", month:"long"});

  const list = scheduledToday();

  const share = list.length ? done/list.length : 0;
  const c = 2 * Math.PI * 31;
  const arc = $("#ringArc");

  arc.setAttribute("stroke-dashoffset", (c * (1 - share)).toFixed(1));
  arc.setAttribute("stroke", state.settings.accent || "#22d3ee");

function habitCard(h, dim){
  const tracking = h.goal.type === "steps";
  const steps = tracking ? stepsToday() : null;
  const done = tracking ? (steps !== null && steps >= h.goal.target) : isDone(h);

  if(tracking && done && !isDone(h)){
    // trust the phone: record the day the moment the target is reached
    h.log[todayStr()] = h.goal.target;
    saveState();
  }
  const card = el("div", "habit" + (done ? " done" : ""));
  if(dim) card.style.opacity = ".62";

  const tick = el("button", "tick" + (done ? " on" : ""));
  tick.style.background = done ? h.color : "transparent";
  tick.innerHTML = done
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>'
    : (tracking
        ? `<span style="font-size:9px;letter-spacing:-.02em">${steps === null ? "—" : Math.round(steps/1000) + "k"}</span>`
        : (h.goal.type === "count" ? `<span>${valueOn(h, todayStr())}</span>` : ""));
  tick.addEventListener("click", ev => {
    ev.stopPropagation();
    if(tracking){ refreshSteps(); renderAll(); toast(steps === null ? "No step sensor on this phone" : "Steps refreshed"); return; }
    if(h.goal.type === "count"){ openCountSheet(h); return; }
    toggleHabit(h);
    renderAll();
    toast(isDone(h) ? "Done — keep it going" : "Cleared");
  });

  const body = el("div", "body");
  const meta = tracking
    ? (steps === null
        ? "Step counter unavailable"
        : `${steps.toLocaleString()} / ${h.goal.target.toLocaleString()} steps · from your phone`)
    : h.goal.type === "count"
      ? `${valueOn(h, todayStr())} / ${h.goal.target} ${h.goal.unit || "times"}`
      : (done ? "Completed today" : "Tap to mark done");
  const reminder = h.reminder ? `<span style="color:var(--accent)">⏰ ${h.reminder}</span>` : "";
  body.innerHTML = `
    <div class="name">${escapeHtml(h.name)}</div>
    <div class="meta"><span class="chip" style="color:${h.color};border-color:${h.color}44">${escapeHtml(h.category)}</span>
      <span>${meta}</span>${reminder}</div>`;

  const dots = el("div", "dots");
  for(let i=0;i<7;i++){
    const day = iso(addDays(new Date(), i - mondayIndex(new Date())));
    dots.appendChild(el("i", (isScheduled(h, day) ? "on" : "") + (day === todayStr() ? " today" : "")));
  }
  body.appendChild(dots);

  const side = el("div");
  const s = streak(h);
  side.innerHTML = s ? `<div class="streak">🔥 ${s}</div>` : "";

  card.appendChild(tick);
  card.appendChild(body);
  card.appendChild(side);
  card.addEventListener("click", () => openHabitSheet(h));
  attachSwipe(card, h);
  return card;
}

function attachSwipe(card, h){
  let startX = 0, startY = 0, dx = 0, active = false;

  card.addEventListener("pointerdown", ev => {
    if(ev.target.closest(".tick")) return;
    startX = ev.clientX; startY = ev.clientY; dx = 0; active = true;
    card.style.transition = "none";
  });

  card.addEventListener("pointermove", ev => {
    if(!active) return;
    dx = ev.clientX - startX;
    if(Math.abs(ev.clientY - startY) > Math.abs(dx)) return;
    card.style.transform = "translateX(" + Math.max(-96, Math.min(96, dx)) + "px)";
  });

  const finish = () => {
    if(!active) return;
    active = false;
    card.style.transition = "transform .16s ease";
    card.style.transform = "translateX(0)";

    if(dx > 64 && !isDone(h)){
      toggleHabit(h);
      renderAll();
      toast(h.name + " — done", "Undo", () => { toggleHabit(h); renderAll(); });
    }else if(dx < -64){
      openHabitSheet(h);
    }
  };

  card.addEventListener("pointerup", finish);
  card.addEventListener("pointercancel", finish);
  card.addEventListener("pointerleave", finish);
}

function sectionTitle(text){

function trendChart(days){
  const card = el("div", "card");
  const series = [];
  for(let i=days-1;i>=0;i--) series.push(dayScore(iso(addDays(new Date(), -i))));
  const w = 320, h = 110, pad = 8;
  const pts = series.map((v,i) => {
    const x = pad + i * (w - pad*2) / Math.max(1, series.length-1);
    const y = h - pad - (v || 0) * (h - pad*2);
    return [x,y];
  });
  let path = "";
  pts.forEach((p,i) => path += (i ? " L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1));
  const area = path + ` L ${w-pad} ${h-pad} L ${pad} ${h-pad} Z`;
  card.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"></path>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></path>
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"></line>
  </svg>`;
  return card;
}

function yearHeatmap(){
  const card = el("div", "card");
  const grid = el("div", "heat");
  const today = new Date();
  const start = addDays(today, -(26*7 + mondayIndex(today)));

  for(let w=0; w<27; w++){
    for(let d=0; d<7; d++){
      const day = addDays(start, w*7 + d);
      const key = iso(day);
      const cell = el("i");
      const score = day > today ? null : dayScore(key);
      if(score) cell.style.background = "rgba(34,211,238," + (0.16 + score*0.8).toFixed(2) + ")";
      cell.title = key + (score ? " · " + pct(score) + "%" : "");
      grid.appendChild(cell);
    }
  }
  card.appendChild(grid);

  const legend = el("div", "legend");
  legend.innerHTML = `<span>less</span>
    <i style="background:var(--panel2)"></i>
    <i style="background:rgba(34,211,238,.3)"></i>
    <i style="background:rgba(34,211,238,.6)"></i>
    <i style="background:rgba(34,211,238,.95)"></i><span>more</span>`;
  card.appendChild(legend);
  return card;
}

function weekdayRates(){
  const totals = new Array(7).fill(0), hits = new Array(7).fill(0);
  state.habits.forEach(h => {
    for(let d = parse(h.created); d <= new Date(); d = addDays(d,1)){
      const key = iso(d);
      if(!isScheduled(h,key)) continue;
      const idx = mondayIndex(d);
      totals[idx]++;
      if(isDone(h,key)) hits[idx]++;
    }
  });
  return totals.map((t,i) => t ? hits[i]/t : 0);
}

function insightCards(){
  const now = new Date();
  const average = offset => {
    let sum = 0, count = 0;
    for(let i=0;i<7;i++){
      const v = dayScore(iso(addDays(now, -(i + offset))));
      if(v !== null){ sum += v; count++; }
    }
    return count ? sum/count : null;
  };
  const recent = average(0), before = average(7);
  const momentum = (recent !== null && before !== null && before > 0.01)
    ? Math.round(((recent - before) / before) * 100) : null;

  let activeDays = 0;
  for(let i=0;i<90;i++){
    const v = dayScore(iso(addDays(now, -i)));
    if(v !== null && v > 0) activeDays++;
  }

  const risks = state.habits.filter(h =>
    streak(h) >= 2 && isScheduled(h, todayStr()) && !isDone(h));

  const rates = weekdayRates();
  const bestIdx = rates.indexOf(Math.max(...rates));

  const card = el("div", "grid2");
  const cell = (value, label, note, colour) => `
    <div class="kpi">
      <b style="font-size:22px;${colour ? "color:" + colour : ""}">${value}</b>
      <span>${label}</span>
      <div class="small muted" style="margin-top:4px;font-size:11px">${note}</div>
    </div>`;

  card.innerHTML =
    cell(momentum === null ? "—" : (momentum >= 0 ? "+" : "") + momentum + "%",
         "Momentum",
         "this week vs last",
         momentum === null ? "" : (momentum >= 0 ? "var(--good)" : "var(--bad)")) +
    cell(risks.length, "At risk", risks.length ? "streak alive today" : "nothing pending",
         risks.length ? "var(--warn)" : "") +
    cell(activeDays, "Active days", "in the last 90") +
    cell(["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][bestIdx],
         "Best day", "highest completion");
  return card;
}

function weekdayChart(){
  const rates = weekdayRates();
  const card = el("div", "card");
  const bars = el("div", "bars");
  for(let i=0;i<7;i++){
    const v = rates[i];
    const wrap = el("div", "barwrap");
    wrap.innerHTML = `<div class="bar" style="height:${6 + v*92}px;${v?'':'background:var(--line)'}"></div>
      <small>${DAYS[i]}</small>`;
    bars.appendChild(wrap);
  }
  card.appendChild(bars);
  return card;
}

function exportData(){
  const json = JSON.stringify(state, null, 2);
  const name = "habits-backup-" + todayStr() + ".json";

  // Inside the Android app a download link does nothing; write the file natively.
  if(window.AndroidBackup && window.AndroidBackup.save){
    const where = window.AndroidBackup.save(json, name);
    if(String(where).startsWith("error")) toast("Backup failed: " + where);
    else { state.settings.lastBackup = todayStr(); saveState(); toast("Saved to " + where); }
    return;
  }

  const blob = new Blob([json], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  state.settings.lastBackup = todayStr();
  saveState();
  toast("Backup downloaded");
}

function importData(){
  // Keep the input in the document: some WebViews ignore a detached one.
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.style.cssText = "position:fixed;left:-100px;top:-100px;opacity:0";
  document.body.appendChild(input);

  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if(!file){ input.remove(); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.habits)) throw new Error("bad file");
        state = normalise(data);
        saveState();
        renderAll();
        toast("Backup restored");
      }catch(e){ toast("That file is not a valid backup"); }
      input.remove();
    };
    reader.onerror = () => { toast("Could not read that file"); input.remove(); };
    reader.readAsText(file);
  });

  input.click();
  setTimeout(() => { if(!input.files || !input.files.length) input.remove(); }, 60000);
}

const TRAIN = {
  stream: null, net: null, raf: null, running: false,
  exercise: "pushups", facing: "user", reps: 0, seconds: 0, goodFrames: 0, frames: 0,
  phase: "up", lastPhaseAt: 0, lastTick: 0, postureBadSince: 0, habitId: ""
};

function trainEl(){ return $("#page-train"); }

function renderTrain(){

  host.innerHTML = "";

  host.appendChild(card);

    const b = el("button", TRAIN.exercise === value ? "on" : "", label);
    b.addEventListener("click", () => { TRAIN.exercise = value; renderTrain(); });
    chips.appendChild(b);
  });
  host.appendChild(chips);

  const start = el("button", "primary", "Start camera session");
  start.style.marginTop = "12px";
  start.addEventListener("click", startTraining);
  host.appendChild(start);

    ? "Prop the phone so your whole body is in frame. It opens on the front camera; press Flip for the rear one."
    : "The camera needs the Android app (or a browser over https).";

let visionPromise = null;
function loadVision(){
  if(window.posenet && window.tf) return Promise.resolve();
  if(visionPromise) return visionPromise;

  const load = src => new Promise((resolve, reject) => {
    const tag = document.createElement("script");
    tag.src = src;
    tag.onload = resolve;
    tag.onerror = () => reject(new Error("missing " + src));
    document.head.appendChild(tag);
  });

  visionPromise = load("vision/tf.min.js")
    .then(() => load("vision/posenet.min.js"))
    .catch(err => { visionPromise = null; throw err; });

  return visionPromise;
}

function CameraSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

async function startTraining(){
  if(!CameraSupported()) { toast("No camera access in this view"); return; }

  const host = trainEl();
  host.innerHTML = "";

  const stage = el("div", "train-stage");
  const video = document.createElement("video");
  video.autoplay = true; video.playsInline = true; video.muted = true;
  const canvas = document.createElement("canvas");
  canvas.width = 480; canvas.height = 640;
  const hud = el("div", "train-hud");
  hud.innerHTML = `<div class="train-pill" id="trainCount">0</div>
                   <div class="train-pill" id="trainQuality">—</div>`;
  const msg = el("div", "train-msg", "Starting the camera…");
  const mirrored = TRAIN.facing === "user";
  video.style.transform = mirrored ? "scaleX(-1)" : "none";
  canvas.style.transform = mirrored ? "scaleX(-1)" : "none";

  const flip = el("button", "ghost", mirrored ? "Switch to back" : "Switch to front");
  flip.style.cssText = "position:absolute;right:12px;bottom:52px;padding:8px 12px;font-size:12px;background:rgba(4,10,18,.72)";
  flip.addEventListener("click", async () => {
    TRAIN.facing = TRAIN.facing === "user" ? "environment" : "user";
    stopTraining(false);
    setTimeout(startTraining, 150);
  });

  stage.appendChild(video); stage.appendChild(canvas); stage.appendChild(hud); stage.appendChild(msg); stage.appendChild(flip);
  host.appendChild(stage);

  const stop = el("button", "ghost");
  stop.textContent = "Stop";
  stop.style.cssText = "width:100%;margin-top:12px";
  stop.addEventListener("click", () => stopTraining(true));
  host.appendChild(stop);

  try{
    TRAIN.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: TRAIN.facing, width: {ideal: 720}, height: {ideal: 960} }, audio: false
    });
    video.srcObject = TRAIN.stream;
    await video.play();
  }catch(e){
    msg.textContent = "Camera unavailable: " + (e.message || e.name) +
      ". Check the permission in Android settings.";
    stage.querySelector("#trainCount").textContent = "—";
    return;
  }

  msg.textContent = "Loading the pose model…";
  try{
    await loadVision();
    if(!TRAIN.net){
      TRAIN.net = await posenet.load({modelUrl: "vision/model/model.json",
                                      inputResolution: 193, outputStride: 16, multiplier: 0.5});
    }
  }catch(e){
    msg.textContent = "Could not load the model: " + e.message;
    return;
  }

  msg.textContent = TRAIN.exercise === "plank"
    ? "Hold a straight line — the timer runs while your form is good."
    : "Lower until your elbows are bent, then push back up.";

  TRAIN.running = true;
  TRAIN.reps = 0; TRAIN.seconds = 0; TRAIN.goodFrames = 0; TRAIN.frames = 0;
  TRAIN.phase = "up"; TRAIN.lastTick = performance.now(); TRAIN.lastPhaseAt = 0;
  loopTraining(video, canvas, msg);
}

function loopTraining(video, canvas, msg){
  if(!TRAIN.running) return;

  trainFrame(video, canvas, msg);
  TRAIN.raf = requestAnimationFrame(() => loopTraining(video, canvas, msg));
}

async function trainFrame(video, canvas, msg){
  if(!video.videoWidth) return;

  if(canvas.width !== video.videoWidth || canvas.height !== video.videoHeight){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  let pose = null;
  try{
    pose = await TRAIN.net.estimateSinglePose(video, {flipHorizontal: false});
  }catch(e){ return; }

  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPose(ctx, pose, canvas);

  const now = performance.now();
  const dt = (now - TRAIN.lastTick) / 1000;
  TRAIN.lastTick = now;

  const angle = bodyAngle(pose, TRAIN.exercise);
  TRAIN.frames++;

  if(TRAIN.exercise === "plank"){
    const result = updatePlank(angle, dt);
    msg.textContent = result.message;
  }else{
    const result = updatePushup(angle, now);
    msg.textContent = result.message;
  }

  const count = $("#trainCount");
  const quality = $("#trainQuality");
  if(count) count.textContent = TRAIN.exercise === "plank"
    ? Math.floor(TRAIN.seconds) + "s"
    : TRAIN.reps + " reps";
  if(quality) quality.textContent = TRAIN.frames
    ? Math.round((TRAIN.goodFrames / TRAIN.frames) * 100) + "% form" : "—";
}

function updatePlank(angle, dt){
  if(angle === null) return {message: "Stand fully in frame"};
  if(angle > 160){
    TRAIN.seconds += dt;
    TRAIN.goodFrames++;
    return {good: true, message: "Good line — hold it"};
  }
  return {good: false, message: "Straighten your hips"};
}

function updatePushup(angle, now){
  if(angle === null) return {message: "Whole body in frame, please"};

  const down = angle < 100, up = angle > 150;
  let counted = false;

  if(down && TRAIN.phase !== "down"){ TRAIN.phase = "down"; TRAIN.lastPhaseAt = now; }
  if(up && TRAIN.phase === "down" && now - TRAIN.lastPhaseAt > 220){
    TRAIN.phase = "up"; TRAIN.reps++; TRAIN.goodFrames++;
    counted = true;
  }

  return {counted, message: down ? "Down — now push" : (up ? "Full range" : "Keep going")};
}

function bodyAngle(pose, exercise){
  const k = {};
  (pose.keypoints || []).forEach(p => { if(p.score > 0.3) k[p.part] = p.position; });
  const mean = (a, b) => a && b ? {x: (a.x+b.x)/2, y: (a.y+b.y)/2} : null;

  if(exercise === "pushups"){
    const shoulder = mean(k.leftShoulder, k.rightShoulder);
    const elbow = mean(k.leftElbow, k.rightElbow);
    const wrist = mean(k.leftWrist, k.rightWrist);
    return angleAt(elbow, shoulder, wrist);
  }

  const shoulder = mean(k.leftShoulder, k.rightShoulder);
  const hip = mean(k.leftHip, k.rightHip);
  const ankle = mean(k.leftAnkle, k.rightAnkle);
  return angleAt(hip, shoulder, ankle);
}

function angleAt(b, a, c){
  if(!a || !b || !c) return null;
  const ab = {x: a.x - b.x, y: a.y - b.y};
  const cb = {x: c.x - b.x, y: c.y - b.y};
  const dot = ab.x*cb.x + ab.y*cb.y;
  const mag = Math.hypot(ab.x, ab.y) * Math.hypot(cb.x, cb.y);
  if(!mag) return null;
  return Math.acos(Math.max(-1, Math.min(1, dot/mag))) * 180/Math.PI;
}

function drawPose(ctx, pose, canvas){
  const sx = canvas.width / (pose.keypoints.length ? 320 : 320);
  ctx.save();
  ctx.strokeStyle = "rgba(34,211,238,.9)";
  ctx.lineWidth = 3;
  const pairs = [["leftShoulder","leftElbow"],["leftElbow","leftWrist"],
                 ["rightShoulder","rightElbow"],["rightElbow","rightWrist"],
                 ["leftShoulder","leftHip"],["rightShoulder","rightHip"],
                 ["leftHip","rightHip"],["leftHip","leftKnee"],["leftKnee","leftAnkle"],
                 ["rightHip","rightKnee"],["rightKnee","rightAnkle"]];
  const map = {};
  (pose.keypoints || []).forEach(p => { map[p.part] = p.position; });
  pairs.forEach(([a,b]) => {
    const pa = map[a], pb = map[b];
    if(pa && pb) { ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke(); }
  });
  ctx.fillStyle = "#22d3ee";
  (pose.keypoints || []).forEach(p => {
    if(p.score < 0.4) return;
    ctx.beginPath(); ctx.arc(p.position.x, p.position.y, 3, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

function stopTraining(askToCredit){
  TRAIN.running = false;
  if(TRAIN.raf) cancelAnimationFrame(TRAIN.raf);
  TRAIN.raf = null;
  if(TRAIN.stream){ TRAIN.stream.getTracks().forEach(t => t.stop()); TRAIN.stream = null; }

  const reps = TRAIN.reps, seconds = Math.floor(TRAIN.seconds);
  renderTrain();

  if(askToCredit && (reps > 0 || seconds > 0)){
    const host = trainEl();
    const card = el("div", "card");
    card.style.marginTop = "12px";
    card.innerHTML = `<div style="font-weight:600">Session finished</div>
      <div class="small muted" style="margin-top:4px">${TRAIN.exercise === "plank"
        ? seconds + " seconds held" : reps + " push-ups"} ·
        ${TRAIN.frames ? Math.round(TRAIN.goodFrames/TRAIN.frames*100) : 0}% good form</div>`;

    const select = document.createElement("select");
    select.style.cssText = "width:100%;margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font-size:14px";
    const options = [["","Credit a habit…"]].concat(state.habits.map(h => [h.id, h.name]));
    options.forEach(([value,label]) => {
      const o = document.createElement("option");
      o.value = value; o.textContent = label; select.appendChild(o);
    });
    card.appendChild(select);

    const save = el("button", "primary", "Mark habit done");
    save.style.marginTop = "10px";
    save.addEventListener("click", () => {
      const habit = state.habits.find(h => h.id === select.value);
      if(!habit){ toast("Pick a habit first"); return; }
      habit.log[todayStr()] = (habit.goal && habit.goal.target) || 1;
      saveState(); renderAll();
      toast(habit.name + " marked done");
    });
    card.appendChild(save);
    host.appendChild(card);
  }
}

    const reminderField = el("div", "field");
    reminderField.innerHTML = `<label>Daily reminder</label>
      <div style="display:flex;gap:10px">
        <input type="time" id="hReminder" value="${escapeHtml(draft.reminder || "")}"
          style="flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font-size:15px">
        <button class="ghost" id="clearReminder" style="flex:0 0 auto">Clear</button>
      </div>
      <div class="small muted" style="margin-top:6px" id="reminderHint"></div>`;
    sheet.appendChild(reminderField);

    const hint = reminderField.querySelector("#reminderHint");
    hint.textContent = remindersAvailable()
      ? "A notification arrives at this time each day."
      : "Notifications are available in the Android app.";
    reminderField.querySelector("#clearReminder").addEventListener("click", () => {
      sheet.querySelector("#hReminder").value = "";
    });

    const catField = el("div", "field");
    catField.innerHTML = `<label>Category</label>`;
    const catWrap = el("div", "swatches");
    CATEGORIES.forEach(c => {
      const b = el("button", "ghost", c);
      const base = "flex:0 0 auto;padding:8px 12px;font-size:12px;";
      b.style.cssText = base + (draft.category === c ? "border-color:var(--accent);color:var(--accent)" : "");
      b.addEventListener("click", () => {
        draft.category = c;
        catWrap.querySelectorAll("button").forEach(x => x.style.cssText = base);
        b.style.cssText = base + "border-color:var(--accent);color:var(--accent)";
      });
      catWrap.appendChild(b);
    });
    catField.appendChild(catWrap);
    sheet.appendChild(catField);

    const colourField = el("div", "field");
    colourField.innerHTML = `<label>Colour</label>`;
    const swatches = el("div", "swatches");
    PALETTE.forEach(c => {
      const b = el("button", "sw" + (draft.color === c ? " on" : ""));
      b.style.background = c;
      b.addEventListener("click", () => {
        draft.color = c;
        swatches.querySelectorAll(".sw").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      });
      swatches.appendChild(b);
    });
    colourField.appendChild(swatches);
    sheet.appendChild(colourField);

    const actions = el("div", "sheet-actions");
    actions.innerHTML = `<button class="ghost" id="cancelHabit">Cancel</button>
      <button class="primary" id="saveHabit" style="margin:0">${habit ? "Save" : "Create"}</button>`;
    sheet.appendChild(actions);

    if(habit){
      const del = el("button", "ghost danger");
      del.textContent = "Delete habit";
      del.style.cssText = "width:100%;margin-top:10px";
      del.addEventListener("click", () => {
        if(!confirm("Delete “" + habit.name + "” and all its history?")) return;
        state.habits = state.habits.filter(x => x.id !== habit.id);
        saveState(); closeSheet(); renderAll();
        toast("Deleted");
      });
      sheet.appendChild(del);
    }

    sheet.querySelector("#cancelHabit").addEventListener("click", closeSheet);
    sheet.querySelector("#saveHabit").addEventListener("click", () => {
      const name = sheet.querySelector("#hName").value.trim();
      if(!name){ toast("Give it a name first"); return; }
      if(!draft.schedule.length){ toast("Pick at least one day"); return; }
      draft.name = name;
      draft.reminder = sheet.querySelector("#hReminder").value || "";
      if(draft.goal.type === "count"){
        draft.goal.target = Math.max(1, parseInt(sheet.querySelector("#hTarget").value || "1", 10));
        draft.goal.unit = sheet.querySelector("#hUnit").value.trim() || "times";
      }
      if(draft.goal.type === "steps"){
        draft.goal.target = Math.max(100, parseInt(sheet.querySelector("#hTarget").value || "10000", 10));
        draft.goal.unit = "steps";
      }

      if(habit) Object.assign(habit, draft);
      else state.habits.push(draft);

      saveState(); syncReminders(); closeSheet(); renderAll();
      toast(habit ? "Saved" : "Habit added");
    });
  });
}

function openCountSheet(h){
  const target = h.goal.target || 1;
  openSheet(sheet => {
    sheet.appendChild(el("h2", "", escapeHtml(h.name)));

    const value = el("div");
    value.style.cssText = "text-align:center;font-size:44px;font-weight:700;letter-spacing:-.03em;margin:6px 0 2px";
    value.textContent = valueOn(h, todayStr());
    const unit = el("div", "small muted");
    unit.style.cssText = "text-align:center;margin-bottom:16px";
    unit.textContent = "of " + target + " " + (h.goal.unit || "times") + " today";
    sheet.appendChild(value);
    sheet.appendChild(unit);

    const track = el("div", "track");
    track.style.height = "10px";
    const fill = el("div", "fill");
    fill.style.background = h.color;
    track.appendChild(fill);
    sheet.appendChild(track);

    const controls = el("div");
    controls.style.cssText = "display:flex;gap:12px;margin:18px 0 6px";
    const minus = el("button", "ghost", "−");
    minus.style.cssText = "flex:1;font-size:24px;padding:16px";
    const plus = el("button", "primary", "＋");
    plus.style.cssText = "flex:1;font-size:24px;padding:16px;margin:0";
    controls.appendChild(minus); controls.appendChild(plus);
    sheet.appendChild(controls);

    const done = el("button", "ghost");
    done.textContent = "Mark today complete";
    done.style.cssText = "width:100%;margin-top:10px";
    sheet.appendChild(done);

    function paint(){
      const v = valueOn(h, todayStr());
      value.textContent = v;
      fill.style.width = Math.min(100, (v/target)*100) + "%";
      done.textContent = v >= target ? "Clear today" : "Mark today complete";
    }

    minus.addEventListener("click", () => { bumpValue(h, -1); paint(); });
    plus.addEventListener("click", () => { bumpValue(h, 1); paint(); });
    done.addEventListener("click", () => {
      if(isDone(h)) delete h.log[todayStr()];
      else h.log[todayStr()] = target;
      saveState(); paint(); renderAll();
    });

    const close = el("button", "primary", "Done");
    close.style.marginTop = "14px";
    close.addEventListener("click", () => { closeSheet(); renderAll(); });
    sheet.appendChild(close);

    paint();
  });
}

function bumpValue(h, delta){
  const day = todayStr();
  const target = h.goal.target || 1;
  const next = clamp(valueOn(h, day) + delta, 0, target);
  if(next <= 0) delete h.log[day]; else h.log[day] = next;
  saveState();
  if(next === target) toast("Target reached");
}

function openDaySheet(day){
  const list = state.habits.filter(h => isScheduled(h, day) && h.created <= day);
  openSheet(sheet => {
    sheet.appendChild(el("h2", "", parse(day).toLocaleDateString(undefined,
      {weekday:"long", day:"numeric", month:"long"})));
    if(!list.length){
      sheet.appendChild(el("div", "small muted", "Nothing scheduled that day."));
      return;
    }
    list.forEach(h => {
      const done = isDone(h, day);
      const row = el("div", "habit");
      row.style.marginBottom = "8px";
      row.innerHTML = `
        <div class="tick ${done?'on':''}" style="width:38px;height:38px;border-radius:12px;
             background:${done?h.color:'transparent'}">
          ${done ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M4 12.5l5 5L20 6.5"/></svg>' : ''}
        </div>
        <div class="body"><div class="name" style="font-size:14px">${escapeHtml(h.name)}</div>
          <div class="meta">${h.goal.type==='count' ? (valueOn(h,day)+' / '+h.goal.target) : 'Yes / no'}</div></div>`;
      row.addEventListener("click", () => {
        toggleHabit(h, day);
        closeSheet(); renderAll();
        toast("Updated");
      });
      sheet.appendChild(row);
    });
  });
}

/* ------------------------------------------------------------------ router */
function showPage(name){
  ["today","stats","calendar","train","settings"].forEach(p => { $("#page-" + p).hidden = (p !== name); });
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.page === name));

  checkDayRollover();
  renderHeader();
  renderToday();

  if(name === "stats") renderStats();
  if(name === "calendar") renderCalendar();
  if(name === "train") renderTrain();
  if(name === "settings") renderSettings();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => showPage(b.dataset.page));
});

/* App shortcuts open a page directly: #stats, #new … */
(function openShortcut(){
  const target = (location.hash || "").replace("#", "").trim();
  if(!target) return;
  if(target === "new"){
    showPage("today");
    setTimeout(() => openHabitSheet(), 250);
    return;
  }
  if(["today","stats","calendar","settings"].includes(target)) showPage(target);
})();

/* Everything is stored per calendar day, so a new day is a clean slate.
   These hooks make the screen follow the clock instead of waiting for a restart. */
let renderedDay = todayStr();

function checkDayRollover(){
  const now = todayStr();
  if(now === renderedDay) return false;
  renderedDay = now;
  const bridge = stepsAvailable();
  if(bridge && bridge.resetBaseline){ try{ bridge.resetBaseline(); }catch(e){} }
  renderAll();
  fitToTabBar();
  syncReminders();
  toast("A new day — habits reset");
  return true;
}

function scheduleMidnight(){
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 3);
  const wait = Math.max(1000, next - now);
  setTimeout(() => { checkDayRollover(); scheduleMidnight(); }, wait);
}

function fitToTabBar(){
  const nav = document.querySelector("nav");
  if(!nav) return;
  const height = Math.ceil(nav.getBoundingClientRect().height);
  document.body.style.paddingBottom = (height + 28) + "px";
}
window.addEventListener("resize", fitToTabBar);
window.addEventListener("orientationchange", () => setTimeout(fitToTabBar, 120));

renderAll();
applyPendingMarks();
fitToTabBar();
setTimeout(fitToTabBar, 250);
syncReminders();
scheduleMidnight();
setInterval(checkDayRollover, 20000);
setInterval(() => {
  if(!usesSteps() || document.visibilityState !== "visible") return;
  const before = stepsCache.value;
  refreshSteps();
  if(stepsCache.value !== before) renderToday();
}, 45000);

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").then(registration => {
    if(registration.waiting) toast("An update is ready — reopen the app");
    registration.addEventListener("updatefound", () => {
      const fresh = registration.installing;
      if(!fresh) return;
      fresh.addEventListener("statechange", () => {
        if(fresh.state === "installed" && navigator.serviceWorker.controller){
          toast("An update is ready — reopen the app");
        }
      });
    });
  }).catch(() => {});
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible") return;
  checkDayRollover();
  syncReminders();
});
</script>
